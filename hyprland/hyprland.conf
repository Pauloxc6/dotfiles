#-----------------------------------------------------------

#-----------------------------------------------------------
# Monitor Setup
# See https://wiki.hyprland.org/Configuring/Monitors/
#-----------------------------------------------------------

monitor=eDP-1,2048x1152,0x0,1
monitor=HDMI-A-1,1920x1080@144,1280x0,1

#----------------------------------------------------
# Auto Start
#----------------------------------------------------

#exec = hyprpaper -c ~/.config/hypr/hyprpaper.conf &
exec-once = waybar &
exec-once = swww init

#-----------------------------------------------------------
# Load pywal color file 
#------------------------------------------------------------

#source = /home/paulo/.cache/wal/colors-hyprland.conf

#----------------------------------------------------
# Programs Env
#----------------------------------------------------

$terminal = kitty
$fileManager = caja
$menu = wofi --show drun
$browser = firefox

#------------------------------------------------------------------
# Env Vars.
#------------------------------------------------------------------

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

#-------------------------------------------
# Keyboard layout and mouse
#-------------------------------------------

input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = abnt2
    kb_options =
    kb_rules =
    numlock_by_default =1

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

#----------------------------------------------------
# General window layout and colors
#----------------------------------------------------

general {
    
    gaps_in = 10
    gaps_out = 20
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    allow_tearing = false
}

#----------------------------------------------------
# General window decoration
#----------------------------------------------------

decoration {
   
    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
	new_optimizations = on
	blurls = waybar
    }

    drop_shadow = true
    shadow_range = 30
    shadow_render_power = 3
    col.shadow = 0x66000000

    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
}

#------------------------------------------------------
# General window animation
#------------------------------------------------------

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

#-------------------------
# Layouts
#------------------------

dwindle {
    pseudotile = yes 
    preserve_split = yes
}

master {
    new_is_master = true
}

gestures {
    workspace_swipe = off
}

misc {
    force_default_wallpaper = -1
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

#---------------------------------------
# Window rules
#---------------------------------------

windowrule = tile,^(kitty)$
#windowrulev2 = suppressevent maximize, class:.*

#-----------------------------------------------------------------------------
# Key bindings
#-----------------------------------------------------------------------------

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod Shift, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, T, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

#----------------------------------------------------
# Terminal Softwares
#----------------------------------------------------

bind = $mainMod, N, exec, kitty -e btop
bind = $mainMod, R, exec, kitty -e ranger
bind = $mainMod, k, exec, kitty -e /home/paulo/my-scs/navegadores.sh

#-------------------------------
# Gravacao de Tela
#-------------------------------

#bind = $mainMod, O, exec, obs
bind = $mainMod, F4, exec, kitty -e wf-recorder -a -f /home/paulo/Vídeos/Gravacoes/output-$(date +"%Y-%m-%d_%H-%M-%S").mp4

#---------------------------------------------
# Edicao
#---------------------------------------------

bind = $mainMod Shift, F1, exec, shotcut

#---------------------------------------------------------
# Basico
#---------------------------------------------------------

bind = $mainMod Shift, B, exec, $browser
bind = $mainMod Shift, W, exec, wlogout
bind = $mainMod Shift, N, exec, mousepad
bind = $mainMod Shift, T, exec, thunderbird
bind = $mainMod Shift, L, exec, libreoffice
bind = $mainMod Shift, X, exec, /usr/bin/mate-calc

#-------------------------------------------------------------------------------------------
# Desenvolvimento
#-------------------------------------------------------------------------------------------

bind = $mainMod, Z, exec, /bin/code-oss
bind = $mainMod, F2, exec, /home/paulo/Downloads/Godot_v4.3-stable_linux.x86_64

#----------------------------------------------------------------------
# Hyrpland
#----------------------------------------------------------------------

bind = $mainMod, H, exec, kitty -e nano ~/.config/hypr/hyprland.conf

#-----------------------------------------------
# VMs
#-----------------------------------------------

bind = $mainMod Shift, V, exec, virt-manager

#-----------------------------------------------------------------------
# Redes
#-----------------------------------------------------------------------

bind = $mainMod, I, exec, /sbin/wireshark
bind = $mainMod Shift, F, exec, filezilla
#bind = $mainMod Shift, A, exec, packettracer
bind = $mainMod Shift, U, exec, putty
bind = $mainMod, Y, exec, kitty -e wavemon 
bind = $mainMod, F6, exec, /home/paulo/Downloads/electrum.AppImage

#-------------------------------------------------------------------------------------------------------------------------------
# Captura de Tela
#-------------------------------------------------------------------------------------------------------------------------------

bind = $mainMod, F10, exec, bash $HOME/.screenshot/captureAll.sh # Todas as janelas
bind = $mainMod, F11, exec, bash $HOME/.screenshot/captureArea.sh # Seleciona Area
bind = $mainMod, F12, exec, bash $HOME/.screenshot/captureScreen.sh # Janela atual

#-------------------------------------------------------------------------------------------
# Games
#-------------------------------------------------------------------------------------------

bind = $mainMod, F3, exec,  /bin/java -jar /home/paulo/Downloads/TLauncher.v10/TLauncher.jar  
bind = $mainMod, F5, exec, flatpak --user run com.heroicgameslauncher.hgl
bind = $mainMod, F7, exec, flatpak --user run com.discordapp.Discord  
bind = $mainMod, F8, exec, steam --gamepadui --steamdeck -no-cef-sandbox  

#-----------------------------------------------------------------------------------------------------------------------------------------------------
# Wallpapers
#-----------------------------------------------------------------------------------------------------------------------------------------------------

bind = $mainMod Alt, 1, exec, swww img /home/paulo/Imagens/Wallpapers/jason.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 2, exec, swww img /home/paulo/Imagens/Wallpapers/japan-street-Dark.png --transition-type wipe --transition-angle 30 --transition-step 90  
bind = $mainMod Alt, 3, exec, swww img /home/paulo/Imagens/Wallpapers/Manga-Girl-Rain.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 4, exec, swww img /home/paulo/Imagens/Wallpapers/solo-leving-1.jpg --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 5, exec, swww img /home/paulo/Imagens/Wallpapers/wall0.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 6, exec, swww img /home/paulo/Imagens/Wallpapers/Fantasy-Japanese-Street.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 7, exec, swww img /home/paulo/Imagens/Wallpapers/garden-shadow.jpg --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 8, exec, swww img /home/paulo/Imagens/Wallpapers/Anime-Room.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 9, exec, swww img /home/paulo/Imagens/Wallpapers/Relaxed_Mario.png --transition-type wipe --transition-angle 30 --transition-step 90
bind = $mainMod Alt, 0, exec, swww img /home/paulo/Imagens/Wallpapers/Red_Eclipse.png --transition-type wipe --transition-angle 30 --transition-step 90

#--------------------------------------------
# Music
#--------------------------------------------

bind = $mainMod, A, exec, /usr/bin/audacious 
 
#---------------------------------------------------------------------------------
# Extras
#---------------------------------------------------------------------------------

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#------------------------------
# Misc Configuration
#------------------------------

misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
}
